<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QuizSlip is a customizable trivia quiz. Pick a topic, a difficulty and a format, then see how many you get right."
    />
    <meta name="theme-color" content="#F1F5F4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>QuizSlip</title>
    <script>
      // Set the theme before first paint so the page never flashes the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem('quizslip:theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : dark
                ? 'dark'
                : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
